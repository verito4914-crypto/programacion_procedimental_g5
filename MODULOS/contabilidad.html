<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
<link rel="stylesheet" href="../CSS/contabilidad.css">
  <title>Contabilidad</title>
</head>

<body>

  <section class="section">
    <div class="container">

      <h1 class="title">Contabilidad</h1>

      <!-- Ventas -->
      <div class="field">
        <label class="label">Ventas</label>
        <div class="control">
          <input class="input" type="text" placeholder="Ingrese las ventas" id="Ventas">
        </div>
      </div>

      <!-- Fecha -->
      <div class="field">
        <label class="label">Fecha</label>
        <div class="control">
          <input class="input" type="date">
        </div>
      </div>

      <!-- Ingresos -->
      <div class="field">
        <label class="label">Ingresos</label>
        <div class="control">
          <input class="input" type="number" placeholder="Ingrese los ingresos" id="Ingresos">
        </div>
      </div>

      <!-- Egresos -->
      <div class="field">
        <label class="label">Egresos</label>
        <div class="control">
          <input class="input" type="number" placeholder="Ingrese los egresos" id="Egresos">
        </div>
      </div>

      <!-- Concepto -->
      <div class="field">
        <label class="label">Concepto</label>
        <div class="control">
          <input class="input" type="text" placeholder="Ingrese el concepto" id="Concepto">
        </div>
      </div>

      <!-- Valor -->
      <div class="field">
        <label class="label">Valor</label>
        <div class="control">
          <input class="input" type="number" placeholder="Ingrese el valor" id="Valor">
        </div>
      </div>

      <!-- Botones -->
      <div class="field is-grouped">
        <div class="control">
          <button class="button is-link">Guardar</button>
        </div>

        <div class="control">
          <button class="button is-danger">Cancelar</button>
        </div>
      </div>

    </div>
  </section>

</body>

</html>
