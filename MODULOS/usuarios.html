<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="stylesheet" href="../CSS/usuarios.css">
    <title>Usuarios</title>
</head>

<body>

  <section class="section">
    <div class="container">

      <h1 class="title">Registro de Usuarios</h1>

      <div class="field">
        <label class="label">Nombre Completo</label>
        <div class="control">
          <input class="input" type="text" placeholder="Ingrese el nombre completo" id="Nombre_completo">
        </div>
      </div>

      <div class="field">
        <label class="label">Telefono</label>
        <div class="control">
          <input class="input" type="tel" placeholder="Ingrese el telefono" id="Telefono">
        </div>
      </div>

    
      <div class="field">
        <label class="label">Direccion</label>
        <div class="control">
          <input class="input" type="text" placeholder="Ingrese la direccion" id="Direccion">
        </div>
      </div>

     
      <div class="field">
        <label class="label">Correo Electronico</label>
        <div class="control">
          <input class="input" type="email" placeholder="Ingrese el correo" id="correo">
        </div>
      </div>

      
      <div class="field">
        <label class="label">Contraseña</label>
        <div class="control">
          <input class="input" type="password" placeholder="Ingrese la contraseña" id="contraseña">
        </div>
      </div>

      
      <div class="field">
        <label class="label">Fecha de Nacimiento</label>
        <div class="control">
          <input class="input" type="date" id="fecha_nacimiento">
        </div>
      </div>

      
      <div class="field">
        <label class="label">Documento de Identidad</label>
        <div class="control">
          <input class="input" type="number" placeholder="Ingrese el documento" id="Documento">
        </div>
      </div>

    
      <div class="field">
        <label class="label">Estado Civil</label>
        <div class="control">
          <div class="select">
            <select>
              <option>Seleccione</option>
              <option>Soltero</option>
              <option>Casado</option>
              <option>Union Libre</option>
            </select>
          </div>
        </div>
      </div>

    
      <div class="field">
        <label class="label">Genero</label>
        <div class="control">
          <div class="select">
            <select>
              <option>Seleccione</option>
              <option>Masculino</option>
              <option>Femenino</option>
              <option>Otro</option>
            </select>
          </div>
        </div>
      </div>

     
      <div class="field">
        <label class="label">Profesion</label>
        <div class="control">
          <input class="input" type="text" placeholder="Ingrese la profesion" id="profesion">
        </div>
      </div>

      
      <div class="field">
        <label class="label">Rol</label>
        <div class="control">
          <div class="select">
            <select>
              <option>Seleccione</option>
              <option>Cliente</option>
              <option>Empleado</option>
              <option>Administrador</option>
            </select>
          </div>
        </div>
      </div>

<div class="field">
        <label class="label">Grupo Sanguineo</label>
        <div class="control">
          <div class="select">
            <select>
              <option>Seleccione</option>
              <option>A+</option>
              <option>A-</option>
              <option>B+</option>
              <option>B-</option>
              <option>AB+</option>
              <option>AB-</option>
              <option>O+</option>
              <option>O-</option>
            </select>
          </div>
        </div>
      </div>
      
      <div class="field is-grouped">
        <div class="control">
          <button class="button is-link">Guardar</button>
        </div>

        <div class="control">
          <button class="button is-danger">Cancelar</button>
        </div>
      </div>

    </div>
  </section>

</body>

</html>
