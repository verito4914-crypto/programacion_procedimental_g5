<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
  <link rel="stylesheet" href="../CSS/inventario.css">
  <link rel="stylesheet" href="../JS/inventario.js">
  <title>Inventario</title>
</head>

<body>

  <section class="section">
    <div class="container">

      <h1 class="title">Inventario de Productos</h1>

      
      <div class="field">
        <label class="label">Codigo Producto</label>
        <div class="control">
          <input class="input" type="text" placeholder="Ingrese el codigo" id="codigo">
        </div>
      </div>

     
      <div class="field">
        <label class="label">Nombre Producto</label>
        <div class="control">
          <input class="input" type="text" placeholder="Ingrese el nombre" id="Nombre_producto">
        </div>
      </div>

     
      <div class="field">
        <label class="label">Precio Unitario</label>
        <div class="control">
          <input class="input" type="number" placeholder="Ingrese el precio" id="Precio_unit">
        </div>
      </div>

   
      <div class="field">
        <label class="label">Cantidad Producto</label>
        <div class="control">
          <input class="input" type="number" placeholder="Ingrese la cantidad" id="Cantidad">
        </div>
      </div>

    
      <div class="field">
        <label class="label">Marca Producto</label>
        <div class="control">
          <input class="input" type="text" placeholder="Ingrese la marca" id="Marca_producto">
        </div>
      </div>


      <div class="field">
        <label class="label">Categoria Producto</label>
        <div class="control">
          <input class="input" type="text" placeholder="Ingrese la categoria" id="Categoria">
        </div>
      </div>

   
      <div class="field">
        <label class="label">Unidad Medida</label>
        <div class="control">
          <input class="input" type="text" placeholder="Ingrese la unidad" id="Unidad">
        </div>
      </div>

  
      <div class="field is-grouped">
        <div class="control">
          <button class="button is-link">Guardar</button>
        </div>

        <div class="control">
          <button class="button is-danger">Cancelar</button>
        </div>
      </div>

    </div>
  </section>

</body>

</html>
