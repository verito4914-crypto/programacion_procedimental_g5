<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
<link rel="stylesheet" href="../CSS/pedido.css">
<link rel="stylesheet" href="../JS/pedido.js">
  <title>Pedido</title>
</head>

<body>

  <section class="section">
    <div class="container">

      <h1 class="title">Pedidos</h1>

      
      <div class="field">
        <label class="label">Producto</label>
        <div class="control">
          <input class="input" type="text" placeholder="Ingrese el producto" id="producto">
        </div>
      </div>

      
      <div class="field">
        <label class="label">Direccion</label>
        <div class="control">
          <input class="input" type="text" placeholder="Ingrese la direccion" id="direccion">
        </div>
      </div>

     
      <div class="field">
        <label class="label">Nombre del Usuario</label>
        <div class="control">
          <input class="input" type="text" placeholder="Ingrese el nombre" id="Nombre_completo">
        </div>
      </div>

      
      <div class="field">
        <label class="label">Cantidad</label>
        <div class="control">
          <input class="input" type="number" placeholder="Ingrese la cantidad" id="Cantidad">
        </div>
      </div>

      
      <div class="field">
        <label class="label">Metodo de Pago</label>
        <div class="control">
          <div class="select">
            <select>
              <option>Seleccione</option>
              <option>Efectivo</option>
              <option>Tarjeta</option>
              <option>Transferencia</option>
              <option>Nequi</option>
            </select>
          </div>
        </div>
      </div>

      
      <div class="field">
        <label class="label">Telefono</label>
        <div class="control">
          <input class="input" type="tel" placeholder="Ingrese el telefono" id="Telefono">
        </div>
      </div>

    
      <div class="field is-grouped">
        <div class="control">
          <button class="button is-link">Guardar</button>
        </div>

        <div class="control">
          <button class="button is-danger">Cancelar</button>
        </div>
      </div>

    </div>
  </section>

</body>

</html>
